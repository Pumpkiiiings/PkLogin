Messages:
  Title:
    # Messaggio inviato prima del login
    before-login:
      title: '&a&lBenvenuto!'
      subtitle: '&7Per il login usa: /login <tua password>'
      delays:
        start: 0
        duration: 9999
        end: 6
    # Messaggio inviato prima della registrazione
    before-register:
      title: '&a&lBenvenuto!'
      subtitle: '&7Per registrarti usa: /register <tua password> <tua password>'
      delays:
        start: 0
        duration: 9999
        end: 6
    # Messaggio inviato dopo il login
    after-login:
      title: ''
      subtitle: '&aHai effettuato il log in con successo!'
      delays:
        start: 0
        duration: 60
        end: 6
    # Messaggio inviato dopo la registrazione
    after-register:
      title: ''
      subtitle: '&aTi sei registrato con successo!'
      delays:
        start: 0
        duration: 60
        end: 6
    premium-auto-login:
      title: '&a&lWelcome!'
      subtitle: '&7Logged in as &6Premium&7.'
      delays:
        start: 0
        duration: 30
        end: 6
    bedrock-auto-login:
      title: '&a&lWelcome!'
      subtitle: '&7Logged in as &eBedrock&7.'
      delays:
        start: 0
        duration: 30
        end: 6
  
  delay-kick:
    # Messaggio inviato quando un utente impiega molto tempo per registrarsi
    register-kick: '&cHai impiegato troppo tempo per registrarti.'
    
    # Messaggio inviato quando un utente impiega molto tempo per accedere
    login-kick: '&cHai impiegato troppo tempo per accedere.'
  
  successful-operations:
    # Messaggio quando un utente scambia la propria password
    password-changed: '&aLa tua password è stata cambiata con successo.'
    
    # Messaggio inviato quando un utente accede con successo
    successful-login: '&aHai effettuato l''accesso con successo.'
    
    # Messaggio inviato quando un utente si registra correttamente
    successful-register: '&aTi sei registrato con successo.'
    
    # Messaggio inviato quando un giocatore si annulla con successo
    unregister-kick: '&cHai annullato la registrazione con successo.'
  
  kick-messages:
    # Messaggio quando un giocatore tenta di accedere al server con una piccola differenza nel nickname
    nick-already-registered: |-
      &cNon puoi entrare con questo nickname {0}&r
      &r&cQuesto nome utente è già registrato come {1}&r
      &r
      &r&cPer entrare, devi usare il tuo nickname senza maiuscole/minuscole
    # Messaggio inviato quando un utente perde molte volte
    failed-many-times: '&cPassword errata.'
    
    # Messaggio inviato quando la password inserita non è corretta
    incorrect-password: '&cPassword errata. Per favore riprova.'
    
    # Messaggio inviato quando un giocatore inserisce un nickname non valido.
    invalid-nickname: '&cSpiacente, stai usando un nickname non valido.'
  
  error-messages:
    # Messaggio inviato quando sei già loggato.
    already-login: '&cSei già loggato.'
    
    # Messaggio inviato quando è già stato registrato un nickname.
    already-registered: '&cQuesto nickname è già stato registrato.'
    
    # Messaggio inviato quando un nickname non è stato ancora registrato.
    not-registered: '&cQuesto nickname è ancora libero.'
    
    # Messaggio inviato quando la password inserita non è uguale alla seconda
    passwords-dont-match: '&cLe password non sono le stesse.'
    
    # Messaggio inviato quando un giocatore tenta di cambiare la password inserendo la stessa password di quella corrente
    password-same-as-old: '&cLa password inserita è la stessa di quella corrente.'
    
    # Messaggio inviato quando la password inserita è troppo grande
    password-too-large: '&cLa password inserita è troppo lunga.'
    
    # Messaggio inviato quando la password inserita è troppo piccola
    password-too-small: '&cLa password inserita è troppo corta.'
    insecure-password: '&cYour password is too weak. It must include numbers, uppercase, lowercase, and symbols.'
    change-password-enforced: '&cFor security reasons, you must update your password right now using &e/changepassword&c.'
    
    # Messaggio quando un giocatore non possiede l'autorizzazione richiesta
    insufficient-permissions: '&cNon sei autorizzato ad eseguire questo comando.'
    
    # Messaggio per cacciare un giocatore ora online
    already-online: '&cQuesto giocatore è già online.'
    
    # Messaggio per mostrare che il comando non può essere eseguito tramite console
    player-command-usage: '&cQuesto comando è stato disattivato tramite console.'
    
    # Messaggio mostrato quando il plugin viene ricaricato.
    plugin-reload-message: '&ePlugin ricaricato con successo.'
    
    # Messaggio inviato quando un'operazione sul database non è stata eseguita correttamente
    database-error: '&cSpiacenti, non è stato possibile completare questa operazione. Per favore riprova. [SQL FAIL]'
    attempts-left: '&cAttempts left: &e{0}'
    player-not-online: '&cThat player is not online.'
    max-ips-reached: '&cYou have reached the maximum number of accounts allowed per IP.'
  
  other-messages:
    # Messaggio inviato per o utilizzando il comando /login
    message-login: '&eUsa il comando /login <password>'
    
    # Messaggio inviato per o utilizzando il comando /register
    message-register: '&eUsa il comando /register <password> <password>'
    
    # Messaggio inviato per o utilizzando il comando /mudarsenha
    message-changepassword: '&eUsa il comando /changepassword <current password> <new password>'
    
    # Messaggio inviato per utilizzare il /unregister command
    message-unregister: '&eUsa il comando /unregister <current password>'
    updates-failed: '&cFailed to find new updates.'
    updates-download-link: '&cDownload the latest version at: https://github.com/Pumpkiiiings/PkLogin/releases'
    updates-invalid-response: '&cFailed to find new updates: invalid response.'
    updates-available: '&eA new version of PkLogin is available! ({0} -> {1})'
    updates-use-command: '&7Use &f/pklogin update &7to download the new version.'
  admin:
    help:
    - '&8&m----------------------------------------'
    - '&b&lPkLogin &8| &7Admin Help'
    - ''
    - '&b/pklogin help &8- &7Show this help message'
    - '&b/pklogin forcelogin <player> &8- &7Force login a player'
    - '&b/pklogin unregister <player> &8- &7Unregister a player'
    - '&b/pklogin changepassword <player> <password> &8- &7Change a player''s password'
    - '&b/pklogin premium <player> &8- &7Set a player as premium'
    - '&b/pklogin cracked <player> &8- &7Set a player as cracked'
    - '&b/pklogin update &8- &7Update the plugin'
    - '&b/pklogin setspawn &8- &7Set the spawn location'
    - '&b/pklogin reload &8- &7Reload the configuration'
    - '&8&m----------------------------------------'
    usage-command: '&eUso correcto: &b%command% %arg%'
    forcelogin-success: '&aPlayer {0} has been forcefully authenticated.'
    unregister-success: '&aPlayer {0} has been unregistered.'
    changepass-success: '&aPassword for player {0} has been successfully changed.'
    changepass-kick: '&cYour password was changed by an administrator.'
    dupeip-header: '&eAccounts for IP/Player &a{0}&e:'
    dupeip-format: '&7- &f{0} &8(&7{1}&8)'
    dupeip-none: '&cNo accounts found for that IP/Player.'
    authme-import-start: '&7Starting AuthMe import...'
    authme-import-not-found: '&cAuthMe SQLite database not found.'
    authme-import-found: '&7Found AuthMe database at &f{0} &7with &f{1} &7accounts.'
    authme-import-progress: '&7Progress: &f{0} &7/ &f{1}'
    authme-import-done: '&aImport complete! &7Players will be re-hashed to &f{0} &7on next login.'
    authme-import-fail: '&cFailed to read AuthMe database: {0}'
    delete-success: '&aPlayer {0} has been deleted.'
    setspawn-success: '&aSpawn location set successfully!'
    verify-format:
    - '&a[PkLogin] Info for {0}:'
    - '&7IP Address: &f{1}'
    - '&7Registered: &f{2}'
    - '&7Last Login: &f{3}'
    - '&7Premium: &f{4}'
    account-not-found: '&cAccount not found.'
  two-factor:
    usage: '&eUsage: /2fa <setup|verify|disable|discord|verify2fa>'
    not-registered: '&cYou must be registered to use 2FA.'
    not-logged-in-setup: '&cYou must be logged in to set up 2FA.'
    already-setup: '&c2FA is already set up on your account.'
    setup-header: '&e--- 2FA Setup ---'
    setup-secret: '&eSecret Key: &a{0}'
    setup-instruction1: '&ePlease enter this secret into your authenticator app.'
    setup-instruction2: '&eThen, verify it using: &a/2fa verify <code>'
    setup-success: '&a2FA has been successfully set up!'
    invalid-code: '&cInvalid 2FA code. Please try again.'
    not-awaiting: '&cYou are not awaiting 2FA verification.'
    not-logged-in-disable: '&cYou must be logged in to disable 2FA.'
    not-setup: '&cYou do not have 2FA set up.'
    disable-usage: '&eUsage: /2fa disable <code>'
    disable-success: '&a2FA has been successfully disabled!'
    discord-not-logged-in: '&cYou must be logged in to link Discord.'
    discord-already-linked: '&cYou already have a Discord account linked.'
    discord-link-header: '&e--- Discord Linking ---'
    discord-link-code: '&eCode: &a{0}'
    discord-link-instruction1: '&ePlease send a Private Message (DM) to our Discord Bot with this code.'
    discord-link-instruction2: '&eThe code will expire in 10 minutes.'
    login-success: '&aYou have successfully logged in with 2FA.'
    login-message: '&eWe have sent a code to your Discord. Type /2fa verify2fa <code> to enter.'
    send-failed: '&cWe could not deliver your 2FA code. Please contact an administrator.'
    too-many-attempts: '&cToo many invalid 2FA codes. Please log in again.'
    verify-usage: '&eUsage: /2fa verify2fa <code>'
  discord-bot:
    link-success: Your Minecraft account **{0}** has been linked to Discord successfully!
    link-error: Something went wrong while linking your account in the database.
    invalid-code: That code is not valid or has expired.
    help: Hi! To link your account, send me the {0}-digit code the Minecraft server gave you with /2fa discord.
    verification-code: 'Your PkLogin verification code is: **{0}**'
  email:
    subject: PkLogin - Verification Code
    body: |-
      Hello {0},

      Your PkLogin verification code is: {1}
  offline:
    already-offline: '&cIl tuo account è già offline (cracked).'
    success: '&aIl tuo account ora è offline! Dovrai usare /login.'
    switch-kick: |-
      &aSei passato alla modalità Offline.
      &eRiconnettiti al server.
  premium:
    already-premium: '&cIl tuo account è già premium.'
    success: '&aIl tuo account ora è Premium! Non dovrai più usare /login.'
    switch-kick: |-
      &aSei passato alla modalità Premium.
      &eRiconnettiti al server.
    current-mode: '&eIl tuo account è attualmente in modalità {0}.'
    warning:
    - '&cATTENZIONE!'
    - '&eSe attivi la modalità premium, entrerai senza /login.'
    - '&4Se NON sei premium, perderai il tuo account per sempre!'
    - '&eUsa /premium confirm per confermare.'
    auto-login: '&aSei stato connesso automaticamente tramite Premium!'
    question:
    - ''
    - '&6&lQuesto nick appartiene a un account originale.'
    - '&7Se l''account è tuo, da ora puoi smettere di usare la password.'
    - '&7Se non lo è, non cambia nulla — continua a giocare così.'
    question-yes: '&a&l[ SÌ, È MIO ]'
    question-no: '&c&l[ NO ]'
    question-hover-yes: '&7Passa a premium e riconnettiti'
    question-hover-no: '&7Continua a usare la password'
    question-declined: '&7Nessun problema. Continuerai a entrare con la tua password.'
    question-confirm:
    - ''
    - '&c&lSei sicuro che questo account sia tuo?'
    - '&7Se non lo è, perderai l''accesso a questo account e solo un admin'
    - '&7potrà restituirtelo.'
    question-confirm-yes: '&4&l[ SÌ, NE SONO SICURO ]'
    question-confirm-hover-yes: '&cSolo se questo account è davvero tuo'
  queue:
    message: '&eYou have &b{0} &econds left to {1} or you will be kicked.'
  captcha:
    required: '&cYou must complete the captcha before authenticating!'
    success: '&aCaptcha completed successfully! You can now login/register.'
    failed: '&cWrong captcha! Try again.'
    inventory-title: Click the &aGreen Wool
    inventory-item: '&aClick Me!'
    chat-instruction: '&ePlease type the following code in chat: &b{code}'
    map-instruction: '&eLook at the map in your hand and type the code!'
  session:
    resumed: '&aBentornato! La tua sessione è ancora aperta, quindi non serve la password.'
version-messages: 2
