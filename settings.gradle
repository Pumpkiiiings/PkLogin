pluginManagement {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'pklogin'
include 'pklogin-api'
include 'pklogin-common'

include 'pklogin-velocity'
include 'pklogin-universal'
include 'pklogin-paper'
include 'pkauth-addon'
include 'pklogin-translator'

include 'pklogin-paper-java25'
project(':pklogin-paper-java25').projectDir = file('Java 25/pklogin-paper')

include 'pklogin-velocity-java25'
project(':pklogin-velocity-java25').projectDir = file('Java 25/pklogin-velocity')
