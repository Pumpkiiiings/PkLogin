plugins {
    id 'java-library'
}

repositories {
    maven { url = uri("https://repo.opencollab.dev/main/") }
}

dependencies {
    compileOnly 'org.geysermc.geyser:api:2.10.0-SNAPSHOT'
    compileOnly 'org.geysermc.floodgate:api:2.2.5-SNAPSHOT'
    compileOnly 'com.google.guava:guava:33.1.0-jre'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.23.1'

    api 'dev.dejvokep:boosted-yaml:1.3.6'

    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.1.4'
    implementation 'com.h2database:h2:2.2.224'
    implementation 'dev.samstevens.totp:totp:1.7.1'
    
    compileOnly 'net.dv8tion:JDA:5.0.0-beta.24'
    compileOnly 'com.sun.mail:javax.mail:1.6.2'
    compileOnly 'de.mkammerer:argon2-jvm:2.11'
    api project(':pklogin-api')
}

task updateLangs(type: JavaExec) {
    mainClass = 'com.pumpkiiings.pklogin.common.LangUpdater'
    classpath = sourceSets.test.runtimeClasspath
}

// Repairs language files whose encoding was mangled at some point.
task fixMojibake(type: JavaExec) {
    group = 'build'
    description = 'Repairs mojibaked language files in place.'
    mainClass = 'com.pumpkiiings.pklogin.common.MojibakeFixer'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootProject.projectDir
}

// Fills translated language files with any key they are missing, in English.
task mergeLangs(type: JavaExec) {
    group = 'build'
    description = 'Copies missing message keys from messages_en.yml into every translation.'
    mainClass = 'com.pumpkiiings.pklogin.common.LangMerger'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootProject.projectDir
}

// Verifies every bundled language file parses and defines every Messages key.
task checkLangs(type: JavaExec) {
    group = 'verification'
    description = 'Checks that all bundled language files define every message key.'
    mainClass = 'com.pumpkiiings.pklogin.common.LanguageFilesTest'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootProject.projectDir
}

// Verifies the bundled config.yml and the Settings enum stay in sync.
task checkConfig(type: JavaExec) {
    group = 'verification'
    description = 'Checks that every Settings key exists in config.yml and vice versa.'
    mainClass = 'com.pumpkiiings.pklogin.common.ConfigKeysTest'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootProject.projectDir
}

// Proves proxy and backend derive the same signing key from shared inputs.
task checkProxySecret(type: JavaExec) {
    group = 'verification'
    description = 'Runs the proxy signing key resolution test.'
    mainClass = 'com.pumpkiiings.pklogin.common.ProxySecretTest'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootProject.projectDir
}

tasks.named('check') { dependsOn 'checkLangs', 'checkConfig', 'checkMigrations', 'checkProxySecret' }
// Proves the migration system never loses customised configuration.
task checkMigrations(type: JavaExec) {
    group = 'verification'
    description = 'Runs the configuration migration guarantees test.'
    mainClass = 'com.pumpkiiings.pklogin.common.MigrationTest'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootProject.projectDir
}
