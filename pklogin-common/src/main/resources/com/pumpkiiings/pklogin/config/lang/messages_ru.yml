Messages:
  Title:
    # Сообщение отправляется перед входом в систему
    before-login:
      title: '&a&lДобро пожаловать!'
      subtitle: '&7Использование: /login <пароль>'
      delays:
        start: 0
        duration: 9999
        end: 6
    # Сообщение отправляется перед регистрацией
    before-register:
      title: '&a&lДобро пожаловать!'
      subtitle: '&7Использование: /register <пароль> <повтор пароля>'
      delays:
        start: 0
        duration: 9999
        end: 6
    # Сообщение отправляется после успешного входа в систему
    after-login:
      title: ''
      subtitle: '&aВы успешно вошли!'
      delays:
        start: 0
        duration: 60
        end: 6
    # Сообщение отправляется после успешной регистрации
    after-register:
      title: ''
      subtitle: '&aВы успешно зарегистрировались!'
      delays:
        start: 0
        duration: 60
        end: 6
    premium-auto-login:
      title: '&a&lWelcome!'
      subtitle: '&7Logged in as &6Premium&7.'
      delays:
        start: 0
        duration: 30
        end: 6
    bedrock-auto-login:
      title: '&a&lWelcome!'
      subtitle: '&7Logged in as &eBedrock&7.'
      delays:
        start: 0
        duration: 30
        end: 6
  
  delay-kick:
    # Сообщение отправляется, когда игрок слишком долго регистрируется
    register-kick: '&cВремя регистрации истекло.'
    
    # Сообщение отправляется, когда игрок слишком долго входит в аккаунт
    login-kick: '&cВы слишком долго входили в аккаунт.'
  
  successful-operations:
    # Сообщение отправляется, когда игрок меняет свой пароль
    password-changed: '&aВаш пароль был успешно изменён.'
    
    # Сообщение отправляется, когда игрок успешно входит в аккаунт
    successful-login: '&aВы успешно вошли в аккаунт.'
    
    # Сообщение отправляется, когда игрок успешно регистрируется
    successful-register: '&aВы успешно зарегистрировались.'
    
    # Сообщение отправляется, когда игрок удаляет свой аккаунт
    unregister-kick: '&cРегистрация аккаунта успешно отозвана.'
  
  kick-messages:
    # Сообщение отправляется, когда игрок пытается зайти на сервер с маленькой разницей в нике
    nick-already-registered: |-
      &cВы не можете войти с ником {0}&r
      &r&cЭто имя пользователя уже зарегистрировано как {1}&r
      &r
      &r&cДля входа вы должны использовать свой никнейм без прописых/строчных букв
    # Сообщение отправляется, когда игрок слишком много раз вводит неправильный пароль
    failed-many-times: '&cВы слишком много раз ввели неправильный пароль.'
    
    # Сообщение отправляется, когда игрок вводит неправильный пароль
    incorrect-password: '&cНеправильный пароль! Попытайтесь снова.'
    invalid-nickname: '&cSorry, but you are using an invalid nickname.'
  
  error-messages:
    # Сообщение отправлено, когда вы уже вошли в систему.
    already-login: '&cВы уже авторизованы.'
    
    # Сообщение отправляется, когда ник уже зарегистрирован.
    already-registered: '&cДанное имя пользователя уже зарегистрировано.'
    
    # Сообщение отправляется, когда ник еще не зарегистрирован.
    not-registered: '&cЭтот ник еще не зарегистрирован.'
    
    # Сообщение отправляется, когда первый пароль не соответствует второму паролю
    passwords-dont-match: '&cПароли не совпадают.'
    
    # Сообщение отправляется, когда игрок пытается сменить пароль, вводя тот же пароль, что и текущий
    password-same-as-old: '&cВведённый пароль совпадает с текущим.'
    
    # Сообщение отправляется, когда игрок вводит слишком длинный пароль
    password-too-large: '&cВы ввели слишком длинный пароль.'
    
    # Сообщение отправляется, когда игрок вводит слишком короткий пароль
    password-too-small: '&cВы ввели слишком короткий пароль.'
    insecure-password: '&cYour password is too weak. It must include numbers, uppercase, lowercase, and symbols.'
    change-password-enforced: '&cFor security reasons, you must update your password right now using &e/changepassword&c.'
    
    # Сообщение отправляется, когда у игрока недостаточно прав для использования какой-либо команды
    insufficient-permissions: '&cУ вас нет прав для использования этой команды.'
    
    # Сообщение выводится, когда игрока кикает из-за того, что он уже зашёл на сервер
    already-online: '&cЭтот игрок уже зашёл на сервер.'
    
    # Сообщение отправляется, если эту команду нельзя выполнить в консоли
    player-command-usage: '&cЭту команду нельзя использовать в консоли.'
    
    # Сообщение отправляется после перезагрузки плагина
    plugin-reload-message: '&ePkLogin успешно перезагружен.'
    
    # Сообщение отправляется, если операция с базой данных не была успешно выполнена
    database-error: '&cК сожалению, нам не удалось выполнить эту операцию. Пожалуйста, попробуйте еще раз. [SQL FAIL]'
    attempts-left: '&cAttempts left: &e{0}'
    player-not-online: '&cThat player is not online.'
    max-ips-reached: '&cYou have reached the maximum number of accounts allowed per IP.'
  
  other-messages:
    # Сообщение для использования команды /login
    message-login: '&eВведите: &7/login <пароль>&e.'
    
    # Сообщения для использования команды /register
    message-register: '&eВведите: &7/register <пароль> <повтор пароля>&e.'
    
    # Сообщение для команды смены пароля /changepassword
    message-changepassword: '&eВведите: &7/changepassword <текущий пароль> <новый пароль>&e.'
    
    # Сообщение отправлено для использования команды /unregister
    message-unregister: '&eИспользуйте команду &7/unregister <текущий пароль>&e.'
    updates-failed: '&cFailed to find new updates.'
    updates-download-link: '&cDownload the latest version at: https://github.com/Pumpkiiiings/PkLogin/releases'
    updates-invalid-response: '&cFailed to find new updates: invalid response.'
    updates-available: '&eA new version of PkLogin is available! ({0} -> {1})'
    updates-use-command: '&7Use &f/pklogin update &7to download the new version.'
  admin:
    help:
    - '&8&m----------------------------------------'
    - '&b&lPkLogin &8| &7Admin Help'
    - ''
    - '&b/pklogin help &8- &7Show this help message'
    - '&b/pklogin forcelogin <player> &8- &7Force login a player'
    - '&b/pklogin unregister <player> &8- &7Unregister a player'
    - '&b/pklogin changepassword <player> <password> &8- &7Change a player''s password'
    - '&b/pklogin premium <player> &8- &7Set a player as premium'
    - '&b/pklogin cracked <player> &8- &7Set a player as cracked'
    - '&b/pklogin update &8- &7Update the plugin'
    - '&b/pklogin setspawn &8- &7Set the spawn location'
    - '&b/pklogin reload &8- &7Reload the configuration'
    - '&8&m----------------------------------------'
    usage-command: '&eUso correcto: &b%command% %arg%'
    forcelogin-success: '&aPlayer {0} has been forcefully authenticated.'
    unregister-success: '&aPlayer {0} has been unregistered.'
    changepass-success: '&aPassword for player {0} has been successfully changed.'
    changepass-kick: '&cYour password was changed by an administrator.'
    dupeip-header: '&eAccounts for IP/Player &a{0}&e:'
    dupeip-format: '&7- &f{0} &8(&7{1}&8)'
    dupeip-none: '&cNo accounts found for that IP/Player.'
    authme-import-start: '&7Starting AuthMe import...'
    authme-import-not-found: '&cAuthMe SQLite database not found.'
    authme-import-found: '&7Found AuthMe database at &f{0} &7with &f{1} &7accounts.'
    authme-import-progress: '&7Progress: &f{0} &7/ &f{1}'
    authme-import-done: '&aImport complete! &7Players will be re-hashed to &f{0} &7on next login.'
    authme-import-fail: '&cFailed to read AuthMe database: {0}'
    delete-success: '&aPlayer {0} has been deleted.'
    setspawn-success: '&aSpawn location set successfully!'
    verify-format:
    - '&a[PkLogin] Info for {0}:'
    - '&7IP Address: &f{1}'
    - '&7Registered: &f{2}'
    - '&7Last Login: &f{3}'
    - '&7Premium: &f{4}'
    account-not-found: '&cAccount not found.'
  two-factor:
    usage: '&eUsage: /2fa <setup|verify|disable|discord|verify2fa>'
    not-registered: '&cYou must be registered to use 2FA.'
    not-logged-in-setup: '&cYou must be logged in to set up 2FA.'
    already-setup: '&c2FA is already set up on your account.'
    setup-header: '&e--- 2FA Setup ---'
    setup-secret: '&eSecret Key: &a{0}'
    setup-instruction1: '&ePlease enter this secret into your authenticator app.'
    setup-instruction2: '&eThen, verify it using: &a/2fa verify <code>'
    setup-success: '&a2FA has been successfully set up!'
    invalid-code: '&cInvalid 2FA code. Please try again.'
    not-awaiting: '&cYou are not awaiting 2FA verification.'
    not-logged-in-disable: '&cYou must be logged in to disable 2FA.'
    not-setup: '&cYou do not have 2FA set up.'
    disable-usage: '&eUsage: /2fa disable <code>'
    disable-success: '&a2FA has been successfully disabled!'
    discord-not-logged-in: '&cYou must be logged in to link Discord.'
    discord-already-linked: '&cYou already have a Discord account linked.'
    discord-link-header: '&e--- Discord Linking ---'
    discord-link-code: '&eCode: &a{0}'
    discord-link-instruction1: '&ePlease send a Private Message (DM) to our Discord Bot with this code.'
    discord-link-instruction2: '&eThe code will expire in 10 minutes.'
    login-success: '&aYou have successfully logged in with 2FA.'
    login-message: '&eWe have sent a code to your Discord. Type /2fa verify2fa <code> to enter.'
    send-failed: '&cWe could not deliver your 2FA code. Please contact an administrator.'
    too-many-attempts: '&cToo many invalid 2FA codes. Please log in again.'
    verify-usage: '&eUsage: /2fa verify2fa <code>'
  discord-bot:
    link-success: Your Minecraft account **{0}** has been linked to Discord successfully!
    link-error: Something went wrong while linking your account in the database.
    invalid-code: That code is not valid or has expired.
    help: Hi! To link your account, send me the {0}-digit code the Minecraft server gave you with /2fa discord.
    verification-code: 'Your PkLogin verification code is: **{0}**'
  email:
    subject: PkLogin - Verification Code
    body: |-
      Hello {0},

      Your PkLogin verification code is: {1}
  offline:
    already-offline: '&cYour account is already offline (cracked).'
    success: '&aYour account is now offline! You will need to use /login.'
    switch-kick: |-
      &aYou have switched to Offline mode.
      &ePlease reconnect to the server.
  premium:
    already-premium: '&cТвой аккаунт уже премиум.'
    success: '&aТвой аккаунт теперь Премиум! Тебе больше не нужен /login.'
    switch-kick: |-
      &aТы переключился на режим Премиум.
      &eПереподключись к серверу.
    current-mode: '&eТвой аккаунт сейчас в режиме {0}.'
    warning:
    - '&cВНИМАНИЕ!'
    - '&eЕсли включишь режим премиум, будешь заходить без /login.'
    - '&4Если ты НЕ премиум, ты потеряешь свой аккаунт навсегда!'
    - '&eИспользуй /premium confirm для подтверждения.'
    auto-login: '&aТы автоматически вошёл через Премиум!'
    question:
    - ''
    - '&6&lЭтот ник принадлежит лицензионному аккаунту.'
    - '&7Если аккаунт твой, с этого момента можешь не вводить пароль.'
    - '&7Если нет, ничего не меняется — играй как играл.'
    question-yes: '&a&l[ ДА, ОН МОЙ ]'
    question-no: '&c&l[ НЕТ ]'
    question-hover-yes: '&7Перейти на премиум и переподключиться'
    question-hover-no: '&7Продолжить с паролем'
    question-declined: '&7Без проблем. Ты продолжишь входить по паролю.'
    question-confirm:
    - ''
    - '&c&lТы уверен, что этот аккаунт твой?'
    - '&7Если нет, ты потеряешь доступ к этому аккаунту, и вернуть его'
    - '&7сможет только администратор.'
    question-confirm-yes: '&4&l[ ДА, Я УВЕРЕН ]'
    question-confirm-hover-yes: '&cТолько если этот аккаунт действительно твой'
  queue:
    message: '&eYou have &b{0} &econds left to {1} or you will be kicked.'
  captcha:
    required: '&cYou must complete the captcha before authenticating!'
    success: '&aCaptcha completed successfully! You can now login/register.'
    failed: '&cWrong captcha! Try again.'
    inventory-title: Click the &aGreen Wool
    inventory-item: '&aClick Me!'
    chat-instruction: '&ePlease type the following code in chat: &b{code}'
    map-instruction: '&eLook at the map in your hand and type the code!'
  session:
