Messages:
  Title:
    # Mensagem enviada antes de logar.
    before-login:
      title: '&a&lBEM-VINDO!'
      subtitle: '&7Utilize /logar <sua senha> para autenticar'
      delays:
        start: 0
        duration: 9999
        end: 6
    # Mensagem enviada antes de registrar.
    before-register:
      title: '&a&lBEM-VINDO!'
      subtitle: '&7Utilize /registrar <sua senha> <sua senha> para registrar'
      delays:
        start: 0
        duration: 9999
        end: 6
    # Mensagem enviada após logar.
    after-login:
      title: ''
      subtitle: '&aVocê se autenticou com sucesso!'
      delays:
        start: 0
        duration: 60
        end: 6
    # Mensagem enviada após registrar.
    after-register:
      title: ''
      subtitle: '&aVocê se registrou com sucesso!'
      delays:
        start: 0
        duration: 60
        end: 6
    premium-auto-login:
      title: '&a&lWelcome!'
      subtitle: '&7Logged in as &6Premium&7.'
      delays:
        start: 0
        duration: 30
        end: 6
    bedrock-auto-login:
      title: '&a&lWelcome!'
      subtitle: '&7Logged in as &eBedrock&7.'
      delays:
        start: 0
        duration: 30
        end: 6
  
  delay-kick:
    # Mensagem enviada quando um usuário demora muito para se registrar.
    register-kick: '&cVocê demorou muito para registrar.'
    
    # Mensagem enviada quando um usuário demora muito para se logar.
    login-kick: '&cVocê demorou muito para logar.'
  
  successful-operations:
    # Mensagem enviada quando um usuário troca a sua senha.
    password-changed: '&aA sua senha foi alterada com sucesso.'
    
    # Mensagem enviada quando um usuário loga com sucesso..
    successful-login: '&aVocê logou com sucesso.'
    
    # Mensagem enviada quando um usuário se registra com sucesso.
    successful-register: '&aVocê se registrou com sucesso.'
    
    # Mensagem enviada quando um jogador se desregistra com sucesso.
    unregister-kick: '&cVocê se desregistrou com sucesso.'
  
  kick-messages:
    # Mensagem quando um jogador tenta logar no servidor com uma pequena diferença no nick.
    nick-already-registered: |-
      &cVocê não pode entrar com o nick {0}&r
      &r&cEste nick já foi registrado como {1}&r
      &r
      &r&cPara entrar, você deverá usar seu nick sem letras maiúsculas/minúsculas
    # Mensagem enviada quando um usuário erra muitas vezes.
    failed-many-times: '&cVocê inseriu a senha incorreta.'
    
    # Mensagem enviada quando a senha inserida é incorreta.
    incorrect-password: '&cSenha incorreta. Por favor, tente novamente.'
    invalid-nickname: '&cSorry, but you are using an invalid nickname.'
  
  error-messages:
    # Mensagem enviada quando você já está logado.
    already-login: '&cVocê já está logado.'
    
    # Mensagem enviada quando um nickname já foi registrado.
    already-registered: '&cEste nickname já foi registrado.'
    
    # Mensagem enviada quando um nickname ainda não foi registrado.
    not-registered: '&cEste nickname ainda não foi registrado.'
    
    # Mensagem enviada quando a senha inserida não é igual a segunda.
    passwords-dont-match: '&cAs senhas não são iguais.'
    
    # Mensagem enviada quando um jogador tenta trocar a senha igual a atual.
    password-same-as-old: '&cA senha inserida é a mesma que a atual.'
    
    # Mensagem enviada quando a senha inserida é muito grande.
    password-too-large: '&cA senha inserida é muito grande.'
    
    # Mensagem enviada quando a senha inserida é muito pequena.
    password-too-small: '&cA senha inserida é muito pequena.'
    insecure-password: '&cYour password is too weak. It must include numbers, uppercase, lowercase, and symbols.'
    change-password-enforced: '&cFor security reasons, you must update your password right now using &e/changepassword&c.'
    
    # Mensagem quando um jogador não possuí a permissão necessária para executar determinado comando.
    insufficient-permissions: '&cVocê não tem permissão para executar este comando.'
    
    # Mensagem enviada quando um jogador com o mesmo nickname já está online.
    already-online: '&cEste jogador já está online.'
    
    # Mensagem enviada quando um comando só pode ser executado por jogadores.
    player-command-usage: '&cEste comando foi desativado via console.'
    
    # Mensagem enviada quando o plugin é recarregado.
    plugin-reload-message: '&eO plugin foi recarregado com sucesso.'
    
    # Mensagem enviada quando uma operação no banco de dados não foi executada com êxito.
    database-error: '&cDesculpe, mas não foi possível completar esta operação. Por favor, tente novamente. [SQL FAIL]'
    attempts-left: '&cAttempts left: &e{0}'
    player-not-online: '&cThat player is not online.'
    max-ips-reached: '&cYou have reached the maximum number of accounts allowed per IP.'
  
  other-messages:
    # Uso do comando /logar.
    message-login: '&eUtilize o comando &7/logar <senha>&e.'
    
    # Uso do comando /register.
    message-register: '&eUtilize o comando &7/registrar <senha> <senha>&e.'
    
    # Uso do comando /mudarsenha.
    message-changepassword: '&eUtilize o comando &7/mudarsenha <senha atual> <nova senha>&e.'
    
    # Uso do comando /unregister.
    message-unregister: '&eUtilize o comando &7/unregister <senha atual>&e.'
    updates-failed: '&cFailed to find new updates.'
    updates-download-link: '&cDownload the latest version at: https://github.com/Pumpkiiiings/PkLogin/releases'
    updates-invalid-response: '&cFailed to find new updates: invalid response.'
    updates-available: '&eA new version of PkLogin is available! ({0} -> {1})'
    updates-use-command: '&7Use &f/pklogin update &7to download the new version.'
  admin:
    help:
    - '&8&m----------------------------------------'
    - '&b&lPkLogin &8| &7Admin Help'
    - ''
    - '&b/pklogin help &8- &7Show this help message'
    - '&b/pklogin forcelogin <player> &8- &7Force login a player'
    - '&b/pklogin unregister <player> &8- &7Unregister a player'
    - '&b/pklogin changepassword <player> <password> &8- &7Change a player''s password'
    - '&b/pklogin premium <player> &8- &7Set a player as premium'
    - '&b/pklogin cracked <player> &8- &7Set a player as cracked'
    - '&b/pklogin update &8- &7Update the plugin'
    - '&b/pklogin setspawn &8- &7Set the spawn location'
    - '&b/pklogin reload &8- &7Reload the configuration'
    - '&8&m----------------------------------------'
    usage-command: '&eUso correcto: &b%command% %arg%'
    forcelogin-success: '&aPlayer {0} has been forcefully authenticated.'
    unregister-success: '&aPlayer {0} has been unregistered.'
    changepass-success: '&aPassword for player {0} has been successfully changed.'
    changepass-kick: '&cYour password was changed by an administrator.'
    dupeip-header: '&eAccounts for IP/Player &a{0}&e:'
    dupeip-format: '&7- &f{0} &8(&7{1}&8)'
    dupeip-none: '&cNo accounts found for that IP/Player.'
    authme-import-start: '&7Starting AuthMe import...'
    authme-import-not-found: '&cAuthMe SQLite database not found.'
    authme-import-found: '&7Found AuthMe database at &f{0} &7with &f{1} &7accounts.'
    authme-import-progress: '&7Progress: &f{0} &7/ &f{1}'
    authme-import-done: '&aImport complete! &7Players will be re-hashed to &f{0} &7on next login.'
    authme-import-fail: '&cFailed to read AuthMe database: {0}'
    delete-success: '&aPlayer {0} has been deleted.'
    setspawn-success: '&aSpawn location set successfully!'
    verify-format:
    - '&a[PkLogin] Info for {0}:'
    - '&7IP Address: &f{1}'
    - '&7Registered: &f{2}'
    - '&7Last Login: &f{3}'
    - '&7Premium: &f{4}'
    account-not-found: '&cAccount not found.'
    cracked-success: "&aPlayer {0} has been set as cracked (offline mode)."
    premium-success: "&aPlayer {0} has been set as premium."
  two-factor:
    usage: '&eUsage: /2fa <setup|verify|disable|discord|verify2fa>'
    not-registered: '&cYou must be registered to use 2FA.'
    not-logged-in-setup: '&cYou must be logged in to set up 2FA.'
    already-setup: '&c2FA is already set up on your account.'
    setup-header: '&e--- 2FA Setup ---'
    setup-secret: '&eSecret Key: &a{0}'
    setup-instruction1: '&ePlease enter this secret into your authenticator app.'
    setup-instruction2: '&eThen, verify it using: &a/2fa verify <code>'
    setup-success: '&a2FA has been successfully set up!'
    invalid-code: '&cInvalid 2FA code. Please try again.'
    not-awaiting: '&cYou are not awaiting 2FA verification.'
    not-logged-in-disable: '&cYou must be logged in to disable 2FA.'
    not-setup: '&cYou do not have 2FA set up.'
    disable-usage: '&eUsage: /2fa disable <code>'
    disable-success: '&a2FA has been successfully disabled!'
    discord-not-logged-in: '&cYou must be logged in to link Discord.'
    discord-already-linked: '&cYou already have a Discord account linked.'
    discord-link-header: '&e--- Discord Linking ---'
    discord-link-code: '&eCode: &a{0}'
    discord-link-instruction1: '&ePlease send a Private Message (DM) to our Discord Bot with this code.'
    discord-link-instruction2: '&eThe code will expire in 10 minutes.'
    login-success: '&aYou have successfully logged in with 2FA.'
    login-message: '&eWe have sent a code to your Discord. Type /2fa verify2fa <code> to enter.'
    send-failed: '&cWe could not deliver your 2FA code. Please contact an administrator.'
    too-many-attempts: '&cToo many invalid 2FA codes. Please log in again.'
    verify-usage: '&eUsage: /2fa verify2fa <code>'
  discord-bot:
    link-success: Your Minecraft account **{0}** has been linked to Discord successfully!
    link-error: Something went wrong while linking your account in the database.
    invalid-code: That code is not valid or has expired.
    help: Hi! To link your account, send me the {0}-digit code the Minecraft server gave you with /2fa discord.
    verification-code: 'Your PkLogin verification code is: **{0}**'
  email:
    subject: PkLogin - Verification Code
    body: |-
      Hello {0},

      Your PkLogin verification code is: {1}
  offline:
    already-offline: '&cSua conta já é offline (cracked).'
    success: '&aSua conta agora é offline! Você vai precisar usar /login.'
    switch-kick: |-
      &aVocê mudou para o modo Offline.
      &eReconecte-se ao servidor.
  premium:
    already-premium: '&cSua conta já é premium.'
    success: '&aSua conta agora é Premium! Você não vai precisar usar /login.'
    switch-kick: |-
      &aVocê mudou para o modo Premium.
      &eReconecte-se ao servidor.
    current-mode: '&eSua conta está no modo {0}.'
    warning:
    - '&cATENÇÃO!'
    - '&eSe você ativar o modo premium, vai entrar sem /login.'
    - '&4Se você NÃO for premium, vai perder sua conta para sempre!'
    - '&eUse /premium confirm para confirmar.'
    auto-login: '&aVocê entrou automaticamente via Premium!'
    question:
    - ''
    - '&6&lEste nick pertence a uma conta original.'
    - '&7Se a conta é sua, você pode parar de usar senha.'
    - '&7Se não é, tudo bem: continue jogando do mesmo jeito.'
    question-yes: '&a&l[ SIM, É MINHA ]'
    question-no: '&c&l[ NÃO ]'
    question-hover-yes: '&7Mudar para premium e reconectar'
    question-hover-no: '&7Continuar usando senha'
    question-declined: '&7Sem problema. Você vai continuar entrando com sua senha.'
    question-confirm:
    - ''
    - '&c&lTem certeza de que esta conta é sua?'
    - '&7Se não for, você vai perder o acesso a esta conta e só um admin'
    - '&7vai poder devolvê-la.'
    question-confirm-yes: '&4&l[ SIM, TENHO CERTEZA ]'
    question-confirm-hover-yes: '&cSó se esta conta for realmente sua'
  queue:
    message: '&eYou have &b{0} &econds left to {1} or you will be kicked.'
  captcha:
    required: '&cYou must complete the captcha before authenticating!'
    success: '&aCaptcha completed successfully! You can now login/register.'
    failed: '&cWrong captcha! Try again.'
    inventory-title: Click the &aGreen Wool
    inventory-item: '&aClick Me!'
    chat-instruction: '&ePlease type the following code in chat: &b{code}'
    map-instruction: '&eLook at the map in your hand and type the code!'
  session:
    resumed: '&aBem-vindo de volta! Sua sessão ainda está aberta, então não é preciso senha.'
