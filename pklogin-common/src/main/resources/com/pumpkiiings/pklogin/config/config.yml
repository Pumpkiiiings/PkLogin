# Official website: https://www.pumpkiiings.com
# Discord: https://www.pumpkiiings.com/discord

# Schema version of this file. PkLogin maintains it — do not edit it by hand.
# On startup an older file is upgraded in place: new options are added, and
# anything you have changed is kept exactly as you set it.
version-config: 7

# Language of the plugin.
# For more information: https://github.com/Pumpkiiiings/PkLogin/blob/master/docs/lang.md
languageFile: 'messages_en.yml'

# Security system related settings.
Security:
  # Amount of time for a player to log in/register (set in seconds).
  time-to-login: 45

  # Hashing algorithm for passwords.
  # Available options: BCRYPT (default), SHA256, SHA512, PBKDF2, ARGON2
  # - BCRYPT  : Strongest general choice. Adaptive cost factor.
  # - PBKDF2  : Widely standardized. 600,000 iterations (OWASP recommended).
  # - ARGON2  : Winner of the Password Hashing Competition. Highest security.
  # - SHA256 / SHA512 : Salted. Not recommended for new servers; kept for compatibility.
  # IMPORTANT: Changing this only affects NEW passwords. Existing hashes
  # are auto-detected and silently re-hashed on the player's next login.
  hash-algorithm: BCRYPT

  # Cost parameters for each algorithm. Higher values slow down both legitimate
  # logins and brute-force attempts, so tune them to your CPU: aim for roughly
  # 250ms per hash. Raising a value re-hashes each password on its next login;
  # lowering one never weakens hashes that already exist.
  hashing:
    bcrypt:
      # Work factor. Each +1 doubles the time taken.
      cost: 12
    pbkdf2:
      # OWASP 2024 recommendation for PBKDF2-HMAC-SHA256.
      iterations: 600000
    argon2:
      iterations: 2
      # Memory per hash in kibibytes. 65536 = 64 MB.
      memory-kb: 65536
      parallelism: 1

  # Minimum delay between two authentication commands from the same player,
  # in milliseconds. Stops a client from spamming attempts faster than the
  # bruteforce counter can react.
  command-cooldown: 750

  # Login sessions.
  #
  # A player who reconnects soon after leaving skips the password. The session is
  # opened when they disconnect, tied to the address they were on, and spent the
  # first time it is used — one disconnect buys one reconnect.
  #
  # Know what the address check does and does not prove before raising the
  # timeout. An address is not a person: everyone behind one router, one public
  # network or one mobile carrier shares it. While a session is open, anyone on
  # that address who types the player's name gets in without the password, and
  # without the 2FA code if the account has one. Minutes are a reasonable bet on
  # a dropped connection; hours are a standing invitation.
  #
  # Sessions are held in memory, so restarting the server ends all of them.
  session:
    enable: true

    # How long a session stays open after the player leaves, in minutes.
    # Set to 0 to turn sessions off just as 'enable: false' does.
    timeout: 5

  # Names that do not match this are rejected before they reach the login step.
  # If you enable username-appender, the check runs on the name the player typed,
  # before any suffix is added.
  valid-name-regex: '([a-zA-Z0-9_]{3,16})|(\*[a-zA-Z0-9_]{3,17})'

  password:
    # Small password size.
    small: 5

    # Size for big passwords.
    large: 15

    secure:
      # Defines whether password strength validations should be performed.
      enable: false

      # Defines whether registered players should be required to update their passwords if their passwords do not meet the secure password pattern.
      enforce: false

      # Defines the pattern used to classify a password as secure.
      secure-regex: '(?=\S*\d)(?=\S*[A-Z])(?=\S*[a-z])(?=\S*[!@#$%^&*?])\S*$'


# Database settings
Database:
  # Available types: sqlite, h2, mariadb, mysql, postgresql
  #
  # sqlite and h2 keep everything in a file next to the plugin and need nothing
  # configured below. The rest connect to a server, so set host, port, database,
  # username and password.
  type: sqlite
  # If using sqlite and you want Velocity and Auth to share the same file, set the absolute path here:
  # Example: "C:/ruta/a/tu/servidor/plugins/pklogin/accounts.db" (Leave empty to use default)
  sqlite-file-path: ""
  host: localhost
  # 3306 for MariaDB and MySQL. PostgreSQL listens on 5432 — change it if you
  # switch, the default below is not right for both.
  port: 3306
  database: pklogin
  username: root
  password: ""

  # Connection pool tuning. The defaults suit most servers.
  pool:
    # Ignored for SQLite, which is always limited to a single connection.
    maximum-pool-size: 10
    # How long to wait for a free connection, in milliseconds.
    connection-timeout: 10000
    # How long a connection may live before being replaced, in milliseconds.
    # Keep this below your MySQL/MariaDB wait_timeout.
    max-lifetime: 1800000

# Running behind a proxy needs nothing configured here.
#
# A server behind a proxy cannot check premium accounts itself — the proxy owns
# the login handshake — so PkLogin reads whether this one is, straight from the
# server's own settings: 'proxies.velocity.enabled' in config/paper-global.yml,
# or 'settings.bungeecord' in spigot.yml.
#
# The messages the proxy sends are signed, with a key both ends derive from the
# Velocity forwarding secret they already share. Nothing to copy, nothing to keep
# in sync. If your network does not use Velocity modern forwarding, premium
# auto-login stays off and the console explains why at startup.

# Automatic login for players that do not use a regular Java premium account.
autologin:
  bedrock:
    # Log Bedrock players in automatically once Floodgate has authenticated them.
    enable: true

    # Skip the registration step for Bedrock players.
    skip-register: true

  premium:
    # Let premium players in with no password at all, including the very first
    # time they connect.
    #
    # Before deciding how to negotiate a connection, PkLogin asks Mojang whether
    # the name belongs to a paid account. If it does, the connection is negotiated
    # as online and the client has to prove it owns the account with Mojang's own
    # encryption handshake. Passing that is proof, not a guess: nobody can fake it
    # without the account. The account is then created without a password.
    #
    # This only applies to names PkLogin has never seen. Anyone already in the
    # database keeps the mode they have, so turning this on cannot lock out a
    # player who is on your server today. An offline account that is really a paid
    # one is converted with /premium confirm, exactly as before.
    #
    # When Mojang cannot be reached the connection is negotiated as offline and
    # the player registers a password as usual. That direction is deliberate: a
    # wrong "offline" costs a password, a wrong "online" locks the player out.
    #
    # (!) OFF BY DEFAULT, and the reason is worth reading before turning it on.
    #     Sending the encryption request is the only way to tell a name's owner
    #     from someone else using it, and a client that cannot answer it cannot
    #     join at all — there is no falling back to a password prompt halfway
    #     through a handshake. So with this on, an offline player using a paid
    #     account's nickname is refused, and all they see is a "Invalid session"
    #     message from their own launcher that PkLogin cannot customise.
    #
    #     On servers where offline players commonly pick paid nicknames, that
    #     reads as "the server is broken". Leave this off and let 'question'
    #     below handle it: nobody is refused, and real owners still get
    #     passwordless logins from their second join onwards.
    enable: false

    # Ask a player who just registered whether a paid account's nickname is
    # theirs.
    #
    # Runs only on the very first registration of a name, and only when Mojang
    # says that name belongs to a paid account. The player gets a clickable
    # yes/no: yes converts the account to premium and asks them to reconnect,
    # after which they never type a password again; no changes nothing and is
    # never asked again.
    #
    # This is what makes 'enable: false' the sensible default rather than a
    # compromise — a real owner reaches the same place, one click later, and
    # nobody is ever locked out of a nickname on a guess.
    question: true

    # How long a Mojang answer about a name is reused, in minutes. The endpoint is
    # rate limited, and a name does not change hands often.
    cache-minutes: 60

    # How long a completed Mojang handshake stays valid, in seconds. It only has
    # to cover the gap between the login packets and the player actually joining.
    session-timeout: 60

    # Timeout for the calls to Mojang's session server, in milliseconds.
    mojang-timeout: 5000

    # How a server with no proxy in front of it sends Mojang's encryption
    # request. Ignored behind a proxy, where the proxy owns the login handshake
    # and none of this applies.
    #
    #  |=> native  [default] PkLogin sends it itself. Nothing to install.
    #  |=> plugin            Use PacketEvents or ProtocolLib, whichever is
    #  |                     installed. There is no need to say which.
    #
    # Neither setting can leave premium logins broken: each falls back to the
    # other when its own path is unavailable, and the console says which one the
    # server ended up on. Set 'plugin' if a Minecraft update outpaces the native
    # handshake and premium players stop being let in.
    handshake-provider: native

# Two-factor authentication shared settings.
# Provider credentials live in the 2fa/ folder.
two-factor:
  # Digits per code. Clamped to 4-9.
  code-length: 6

  # How long a login code stays valid, in seconds.
  login-code-expiration: 300

  # How long an account-linking code stays valid, in seconds.
  link-code-expiration: 600

  # Wrong codes allowed before the pending code is discarded and the player has
  # to log in again.
  max-verify-attempts: 5

  discord:
    # Link codes a single Discord user may try per window, so nobody can walk
    # the whole code space by messaging the bot.
    max-link-attempts: 10
    # Length of that window, in seconds.
    link-attempt-window: 600

# Update checker.
updates:
  # Contact GitHub on startup to look for a newer release.
  check: true
  # Tell admins with pklogin.admin.update when they log in.
  notify-admins: true

# AuthMe import (/pklogin authme-import).
authme-import:
  # Absolute path to authme.db. Leave empty to use plugins/AuthMe/authme.db.
  database-path: ""

username-appender:
  enabled: false
  premium:
    username-appendix: ""
    position: "suffix"
    domains:
      - "premium.myserver.com"
  offline:
    username-appendix: "+"
    position: "suffix"
    domains:
      - "myserver.com"

legacy:
  # Defines the type of unique id for users.
  #
  # - Options available:
  #  |=> REAL [recommended]
  #  |=> RANDOM
  #  |=> OFFLINE
  unique-id-type: OFFLINE


# User Interface settings.
ui:
  # Sets whether on-screen messages will be sent.
  use-title-bar: true

  # Sets whether messages in actionbars will be sent.
  use-action-bar: true

# Teleport settings.
teleport:
  # Sets whether the player will be teleported to a safe position upon entering.
  safe-location: true

  # Defines if the player will be teleported to the last location upon exit.
  last-location: true

# Limbo settings.
limbo:
  # Sets whether other players should be hidden before logging in.
  hide-players-before-login: true

  # Defines whether the movement should be locked before authenticating.
  block-player-walk: true

  # Defines whether the blinding effect will be added before logging in.
  blindness-effect: false

  inventory:
    # Sets whether items should be hidden before logging in.
    hide-inventory: true

  # Speeds restored once the player authenticates. These are the vanilla values;
  # change them only if another plugin on your server uses different ones.
  # Only applied when block-player-walk is enabled.
  restore:
    walk-speed: 0.2
    fly-speed: 0.1

passwords:
  bruteforce:
    # Sets the maximum number of incorrect attempts a player can make.
    max-login-tries: 3

# General security settings.
security:
  captcha:
    # Enable captcha before login/register?
    enable: false
    # Type of captcha: INVENTORY, CHAT, MAP
    type: INVENTORY
    # Characters in the code, for the CHAT and MAP types.
    code-length: 5
    # Block every command until the captcha is solved.
    # /login and /register stay blocked either way.
    blocked-commands: true
    
  ip-limit:
    # Sets whether the per-IP account limiter should be used.
    enable: true

    # Sets the maximum number of records per IP address.
    limit: 3

  # Sets whether the plugin should ignore the "This player is already online" check if the IP is the same as the one registered.
  # - This feature is useful if the player loses connection with the server and tries to log in again.
  bypass-online-check-with-same-address: true
